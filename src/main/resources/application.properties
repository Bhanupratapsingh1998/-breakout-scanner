spring.application.name=breakout-scanner
# Render (and most PaaS hosts) assign a port via $PORT and health-check that port only; a
# service bound to a fixed port never goes live. Falls back to 9111 for local runs.
server.port=${PORT:9111}

# Neon Postgres holds the trade journal. Credentials never live in this file — it is tracked in
# git. Locally they come from .env (gitignored); in Docker/CI the same three names are supplied as
# real environment variables, which take precedence over the file.
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Neon's free tier suspends the compute after ~5 minutes idle, so the first query after a pause
# pays a cold start. minimum-idle=0 lets the pool drain rather than holding connections against a
# suspended compute, and the raised connection-timeout gives a new connection time to wake it
# instead of surfacing the wake-up as a connection failure.
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=600000

# Dialect is intentionally not pinned: Hibernate detects PostgreSQL from the driver, and a stale
# explicit dialect is a confusing failure mode.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ---- Bullish Stocks ranking engine (BullishConfig) ----
# Every threshold the Nifty 500 bullish ranking judges a stock against. Changing one here changes
# the live engine without a rebuild; the defaults in BullishConfig are what the unit tests assert
# against, so a value changed here will not silently break the test suite.
bullish.score-a-plus=85
bullish.score-strong=75
bullish.score-watchlist=65
bullish.score-neutral=50
# A score floor for BUY NOW - necessary but never sufficient. The structural checks in
# PullbackAnalyzer (failed breakout, overextension, trend alignment, a valid trade plan and a
# non-bearish market) all have to pass first; this only stops a weak-but-clean setup being called.
bullish.buy-now-min-score=70
bullish.breakout-volume-ratio=1.5
bullish.breakout-confirm-buffer=0.005
bullish.near-breakout-band=0.03
bullish.retest-band=0.03
bullish.minimum-risk-reward=2.0
bullish.preferred-risk-reward=3.0
bullish.max-entry-extension=0.05
bullish.max-risk-pct=0.10
bullish.atr-stop-buffer=0.5
bullish.extended-atrs-from-ema20=3.0
bullish.severe-atrs-from-ema20=4.5
bullish.extended-rsi=75
bullish.severe-rsi=82
bullish.max-extension-from-breakout=0.12
# Above the detectors' base of 55 so a pattern needs corroborating evidence, not just the right
# shape - at 55, 96% of a live Nifty 500 run matched something, which is not a useful signal.
bullish.min-pattern-confidence=65
bullish.regime-bullish-score=7
bullish.regime-bearish-score=4
bullish.min-bars=250
bullish.max-results=250

# ---- Index 500 sector analysis (Index500Config) ----
# Shares the 18mo daily window with the other scans so they reuse each other's cached bars.
index500.range=18mo
index500.min-bars=250
# A six-month fall of at least this much is what "declined" means in the summary counts.
index500.decline-threshold-pct=10
index500.oversold-rsi=40
index500.confirming-volume-ratio=1.2
index500.strong-pattern-confidence=7.0
index500.max-results=250
