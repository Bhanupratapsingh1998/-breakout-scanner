spring.application.name=breakout-scanner
# Render (and most PaaS hosts) assign a port via $PORT and health-check that port only; a
# service bound to a fixed port never goes live. Falls back to 9111 for local runs.
server.port=${PORT:9111}

# Neon Postgres holds the trade journal. Credentials never live in this file — it is tracked in
# git. Locally they come from .env (gitignored); in Docker/CI the same three names are supplied as
# real environment variables, which take precedence over the file.
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Neon's free tier suspends the compute after ~5 minutes idle, so the first query after a pause
# pays a cold start. minimum-idle=0 lets the pool drain rather than holding connections against a
# suspended compute, and the raised connection-timeout gives a new connection time to wake it
# instead of surfacing the wake-up as a connection failure.
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=600000

# Dialect is intentionally not pinned: Hibernate detects PostgreSQL from the driver, and a stale
# explicit dialect is a confusing failure mode.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
