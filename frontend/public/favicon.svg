<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" role="img" aria-label="Breakout Scanner">
  <!-- Same mark as the in-app Logo: red candles, accent arrow, green tile. Colors are flattened
       hex, not tokens or rgba(): a standalone favicon cannot read the page's custom properties,
       and SVG 1.1 presentation attributes are not required to accept alpha color functions.
       The green stays pale on purpose, since a saturated tile behind red candles goes muddy at
       16px and collapses entirely for red/green color blindness.
       NOTE: no double hyphen may appear in an XML comment, or the whole file fails to parse. -->
  <rect x="0.5" y="0.5" width="23" height="23" rx="5" fill="#dff1de" stroke="#8fd38e"/>
  <g transform="translate(1.84 1.8) scale(0.85)">
    <rect x="3" y="14" width="3.2" height="7" rx="0.6" fill="#d03b3b" opacity="0.55"/>
    <rect x="8.4" y="10" width="3.2" height="11" rx="0.6" fill="#d03b3b" opacity="0.78"/>
    <rect x="13.8" y="6" width="3.2" height="15" rx="0.6" fill="#d03b3b"/>
    <path d="M17.5 8.5L21.5 3M21.5 3H17.7M21.5 3V6.8" fill="none" stroke="#2a78d6"
          stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
