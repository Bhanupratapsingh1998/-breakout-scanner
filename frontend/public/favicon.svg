<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="BPS TradeLab">
  <!-- The BPS TradeLab coin, minus its lettering. The real logo carries "BPS" over "TRADELAB"
       inside the ring; at 16px those set about two pixels tall and turn into noise, so this
       keeps only the parts that survive the size: the gold ring, the navy field, the rising
       candles and the arrow through them.
       Colors are flattened hex, not tokens: a standalone favicon cannot read the page's custom
       properties, and SVG presentation attributes are not required to accept alpha color
       functions. They are the sampled brand values.
       NOTE: no double hyphen may appear in an XML comment, or the whole file fails to parse. -->
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eacc70"/>
      <stop offset="0.5" stop-color="#cca434"/>
      <stop offset="1" stop-color="#eacc70"/>
    </linearGradient>
  </defs>
  <circle cx="16" cy="16" r="15" fill="#0d1421" stroke="url(#ring)" stroke-width="2.2"/>
  <g stroke-linecap="round">
    <!-- one red candle, then the green run: the logo's own sequence -->
    <path d="M8 19.5v3.4" stroke="#e75966" stroke-width="1.1"/>
    <rect x="6.7" y="20" width="2.6" height="2.4" rx="0.7" fill="#e75966"/>
    <path d="M13 15.2v4.2" stroke="#02c78e" stroke-width="1.1"/>
    <rect x="11.7" y="15.8" width="2.6" height="3.2" rx="0.7" fill="#02c78e"/>
    <path d="M18 11.6v4.6" stroke="#02c78e" stroke-width="1.1"/>
    <rect x="16.7" y="12.2" width="2.6" height="3.6" rx="0.7" fill="#02c78e"/>
    <path d="M23 7.8v5" stroke="#02c78e" stroke-width="1.1"/>
    <rect x="21.7" y="8.4" width="2.6" height="4" rx="0.7" fill="#02c78e"/>
  </g>
  <path d="M6.6 22.6C11 21.4 17.6 17 23.4 8.6" fill="none" stroke="url(#ring)"
        stroke-width="1.9" stroke-linecap="round"/>
  <path d="M19.2 8.4h4.9v4.6" fill="none" stroke="url(#ring)" stroke-width="1.9"
        stroke-linecap="round" stroke-linejoin="round" transform="rotate(-33 23.4 8.6)"/>
</svg>
